<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/tema.js"></script>
  <title>Panel técnico · Sony Soporte Técnico</title>
</head>
<body class="min-h-screen">

<header class="topbar">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
    <p class="text-xl font-extrabold tracking-[0.25em] text-sony">SONY <span class="ml-1 text-xs font-medium tracking-normal text-slate-400">Panel técnico</span></p>
    <div class="flex items-center gap-3">
      <span class="hidden text-sm text-slate-300 sm:inline" data-nombre-usuario></span>
      <button type="button" data-cerrar-sesion class="rounded-lg bg-white/10 px-3 py-1.5 text-xs font-semibold hover:bg-white/20">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl space-y-6 px-4 py-6 sm:px-6 lg:py-8">

  <section class="grid grid-cols-3 gap-3" aria-label="Resumen">
    <div class="card p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Disponibles</p><p id="statDisponibles" class="mt-1 text-2xl font-extrabold text-slate-900">–</p></div>
    <div class="card p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Mis órdenes activas</p><p id="statActivas" class="mt-1 text-2xl font-extrabold text-slate-900">–</p></div>
    <div class="card p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Por atender</p><p id="statPendientes" class="mt-1 text-2xl font-extrabold text-sony">–</p></div>
  </section>

  <section class="card-pad">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="inline-flex rounded-lg bg-slate-100 p-1 text-sm font-semibold" role="tablist" id="tabs">
        <button type="button" role="tab" data-vista="mias" class="rounded-md px-4 py-1.5">Mis órdenes</button>
        <button type="button" role="tab" data-vista="disponibles" class="rounded-md px-4 py-1.5">Disponibles</button>
      </div>
      <div class="flex flex-col gap-2 sm:flex-row">
        <label class="sr-only" for="buscador">Buscar</label>
        <input id="buscador" type="search" maxlength="60" class="input sm:w-56" placeholder="Buscar código o producto">
        <label class="sr-only" for="filtroGravedad">Prioridad</label>
        <select id="filtroGravedad" class="input sm:w-40">
          <option value="todas">Toda prioridad</option>
          <option value="alta">Alta</option>
          <option value="media">Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
    </div>
    <div id="chipsEstado" class="mt-4 flex flex-wrap gap-2" role="group" aria-label="Filtrar por estado"></div>
  </section>

  <section id="tablaTickets" class="space-y-8" aria-live="polite">
    <div class="skeleton h-44"></div>
    <div class="skeleton h-44"></div>
  </section>
</main>

<script src="/js/common.js"></script>
<script src="/js/tecnico.js"></script>
</body>
</html>
